[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cecl"
version = "0.1.0"
description = "Lifetime expected credit loss under CECL: competing-risk model for a residential mortgage portfolio (FIM 590)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "statsmodels",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "jupyterlab"]
gbm = ["lightgbm", "shap"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
